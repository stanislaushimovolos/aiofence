[project]
name = "aiofence"
dynamic = ["version"]
description = "Python asyncio-native cancellation context library"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    { name = "Shimovolos Stanislav" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

# The core package stays dependency-free. These extras carry only the floors
# `aiofence.contrib` needs: FastAPI >= 0.118 tears yield dependencies down
# after the response (0.106-0.117 did it before, which unbinds the disconnect
# fencing for the whole streaming phase), and Starlette >= 0.42 has the ASGI
# spec_version gate in StreamingResponse.
# See docs/disconnect-watcher-analysis.md.
[project.optional-dependencies]
fastapi = ["fastapi>=0.118"]
starlette = ["starlette>=0.42"]

[project.urls]
Repository = "https://github.com/stanislaushimovolos/aiofence"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "aiofence/__version__.py"

[dependency-groups]
dev = [
    "fastapi>=0.118",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15.2",
    "sse-starlette>=2.0",
    "starlette>=0.42",
    "uvloop>=0.21",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# ruff 0.16 formats Python code blocks in Markdown by default. Docs snippets are
# laid out for reading (multi-line builder chains, aligned trailing comments), so
# they stay out of the formatter's reach. docs/specs holds design scratch — probe
# scripts written to answer one question, not code we ship.
extend-exclude = ["*.md", "docs/specs/"]

[tool.ruff.lint]
select = [
    "ALL",  # enable everything, then exclude what doesn't fit
]
ignore = [
    "D",       # pydocstyle — we use minimal docstrings per project conventions
    "ANN",     # flake8-annotations — we already have type hints, these rules are noisy
    "ERA",     # eradicate — flags commented-out code, too many false positives
    "T20",     # flake8-print — print() is fine during development
    "FIX",     # flake8-fixme — TODO/FIXME comments are OK
    "TD",      # flake8-todos — don't enforce TODO format
    "CPY",     # flake8-copyright — no copyright headers needed
    "INP",     # flake8-no-pep420 — false positives on namespace packages
    "COM812",  # trailing comma — conflicts with ruff formatter
    "EM101",   # string literal in exception — too pedantic for simple errors
    "TRY003",  # long exception messages — same as above
    "SLF001",  # private member access — intentional for asyncio internals
    "TC",      # flake8-type-checking — not worth the complexity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "SIM117", "PT012", "SIM105", "PLR2004", "ARG005", "PLC0415"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["/aiofence", "/README.md", "/LICENSE"]

[tool.ruff.format]
quote-style = "double"
